<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Isometric RPG</title>
    <script 
src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></ssrc="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/threemin.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4a4a8a;
            box-shadow: 0 0 15px rgba(0, 0, 255, 0.3);
        }
        #ui h1 {
            margin: 0 0 10px 0;
            color: #64b5f6;
            text-shadow: 0 0 5px rgba(100, 181, 246, 0.5);
        }
        #stats {
            display: flex;
            gap: 20px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4caf50;
        }
        #controls {
            margin-top: 15px;
            font-size: 14px;
            color: #bbbbbb;
        }
        #controls kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
        }
        #message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #4a4a8a;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #message.show {
            opacity: 1;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 30, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #loading h2 {
            color: #64b5f6;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(100, 181, 246, 0.7);
        }
        .progress-bar {
            width: 300px;
            height: 20px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #4a4a8a;
        }
        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2196f3, #21cbf3);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <h1>Isometric RPG</h1>
            <div id="stats">
                <div class="stat">
                    <div>Health</div>
                    <div class="stat-value" id="health">100</div>
                </div>
                <div class="stat">
                    <div>Level</div>
                    <div class="stat-value" id="level">1</div>
                </div>
                <div class="stat">
                    <div>Gold</div>
                    <div class="stat-value" id="gold">50</div>
                </div>
            </div>
            <div id="controls">
                <p>Move: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> 
<kbd>D</kbd> | Interact: <kbd>E</kbd></p>
            </div>
        </div>
        <div id="message">You found a treasure chest!</div>
        <div id="loading">
            <h2>Loading Game World...</h2>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
    </div>

    <script>
        // Main game variables
        let scene, camera, renderer;
        let world = [];
        let player, playerMesh;
        let keys = {};
        let gameObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let clock = new THREE.Clock();
        let playerPosition = { x: 5, z: 5 };
        let playerDirection = { x: 0, z: 1 };
        let tileSize = 2;
        let worldSize = 15;
        let moveSpeed = 5;
        let isMoving = false;
        let moveTarget = null;
        let moveDirection = null;
        let health = 100;
        let level = 1;
        let gold = 50;

        // Initialize the game
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 50);

            // Create camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / 
window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 15);
            camera.lookAt(0, 0, 0);

            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            
document.getElementById('gameContainer').appendChild(renderer.domElement);

            // Add lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 
0.8);
            directionalLight.position.set(10, 20, 15);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            // Create world
            createWorld();

            // Create player
            createPlayer();

            // Add event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            document.addEventListener('click', onMouseClick);

            // Start game loop
            animate();

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1500);
        }

        // Create the game world
        function createWorld() {
            // Create ground
            const groundGeometry = new THREE.PlaneGeometry(worldSize * 
tileSize, worldSize * tileSize);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x3d8c40,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Create grid lines
            const gridHelper = new THREE.GridHelper(worldSize * tileSize, 
worldSize, 0x000000, 0x000000);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Create world tiles
            for (let x = 0; x < worldSize; x++) {
                world[x] = [];
                for (let z = 0; z < worldSize; z++) {
                    // Create tile
                    const tileGeometry = new THREE.BoxGeometry(tileSize, 
0.2, tileSize);
                    const tileMaterial = new THREE.MeshStandardMaterial({ 
                        color: 0x5a9c5a,
                        roughness: 0.8
                    });
                    const tile = new THREE.Mesh(tileGeometry, 
tileMaterial);
                    tile.position.set(x * tileSize - (worldSize * 
tileSize) / 2 + tileSize / 2, -0.1, z * tileSize - (worldSize * tileSize) 
/ 2 + tileSize / 2);
                    tile.receiveShadow = true;
                    scene.add(tile);
                    world[x][z] = { type: 'grass', mesh: tile };

                    // Randomly place trees, rocks, and chests
                    if (Math.random() > 0.8 && !(x === playerPosition.x && 
z === playerPosition.z)) {
                        const objectType = Math.random() > 0.7 ? 'tree' : 
Math.random() > 0.5 ? 'rock' : 'chest';
                        createObject(x, z, objectType);
                    }
                }
            }

            // Create border walls
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 
0x7a5c3d });
            for (let i = 0; i < worldSize; i++) {
                // North wall
                const northWall = new THREE.Mesh(
                    new THREE.BoxGeometry(tileSize, 2, 0.2),
                    wallMaterial
                );
                northWall.position.set(i * tileSize - (worldSize * 
tileSize) / 2 + tileSize / 2, 1, -worldSize * tileSize / 2);
                northWall.castShadow = true;
                scene.add(northWall);

                // South wall
                const southWall = new THREE.Mesh(
                    new THREE.BoxGeometry(tileSize, 2, 0.2),
                    wallMaterial
                );
                southWall.position.set(i * tileSize - (worldSize * 
tileSize) / 2 + tileSize / 2, 1, worldSize * tileSize / 2);
                southWall.castShadow = true;
                scene.add(southWall);

                // West wall
                const westWall = new THREE.Mesh(
                    new THREE.BoxGeometry(0.2, 2, tileSize),
                    wallMaterial
                );
                westWall.position.set(-worldSize * tileSize / 2, 1, i * 
tileSize - (worldSize * tileSize) / 2 + tileSize / 2);
                westWall.castShadow = true;
                scene.add(westWall);

                // East wall
                const eastWall = new THREE.Mesh(
                    new THREE.BoxGeometry(0.2, 2, tileSize),
                    wallMaterial
                );
                eastWall.position.set(worldSize * tileSize / 2, 1, i * 
tileSize - (worldSize * tileSize) / 2 + tileSize / 2);
                eastWall.castShadow = true;
                scene.add(eastWall);
            }
        }

        // Create game objects (trees, rocks, chests)
        function createObject(x, z, type) {
            const worldX = x * tileSize - (worldSize * tileSize) / 2 + 
tileSize / 2;
            const worldZ = z * tileSize - (worldSize * tileSize) / 2 + 
tileSize / 2;
            
            let object;
            
            switch(type) {
                case 'tree':
                    const trunkGeometry = new THREE.CylinderGeometry(0.3, 
0.4, 2, 8);
                    const trunkMaterial = new THREE.MeshStandardMaterial({ 
color: 0x8B4513 });
                    const trunk = new THREE.Mesh(trunkGeometry, 
trunkMaterial);
                    trunk.position.set(worldX, 1, worldZ);
                    trunk.castShadow = true;
                    scene.add(trunk);
                    
                    const leavesGeometry = new THREE.SphereGeometry(1.5, 
8, 8);
                    const leavesMaterial = new 
THREE.MeshStandardMaterial({ color: 0x2E8B57 });
                    const leaves = new THREE.Mesh(leavesGeometry, 
leavesMaterial);
                    leaves.position.set(worldX, 3, worldZ);
                    leaves.castShadow = true;
                    scene.add(leaves);
                    
                    object = { type: 'tree', x, z, mesh: [trunk, leaves] 
};
                    break;
                    
                case 'rock':
                    const rockGeometry = new 
THREE.DodecahedronGeometry(0.8, 0);
                    const rockMaterial = new THREE.MeshStandardMaterial({ 
                        color: 0x808080,
                        roughness: 0.9
                    });
                    const rock = new THREE.Mesh(rockGeometry, 
rockMaterial);
                    rock.position.set(worldX, 0.8, worldZ);
                    rock.castShadow = true;
                    scene.add(rock);
                    
                    object = { type: 'rock', x, z, mesh: rock };
                    break;
                    
                case 'chest':
                    const chestGeometry = new THREE.BoxGeometry(1, 0.7, 
0.7);
                    const chestMaterial = new THREE.MeshStandardMaterial({ 
color: 0xD2691E });
                    const chest = new THREE.Mesh(chestGeometry, 
chestMaterial);
                    chest.position.set(worldX, 0.35, worldZ);
                    chest.castShadow = true;
                    scene.add(chest);
                    
                    // Chest lid
                    const lidGeometry = new THREE.BoxGeometry(1, 0.1, 
0.7);
                    const lidMaterial = new 
THREE.MeshStandardMaterial({ color: 0x8B4513 });
                    const lid = new THREE.Mesh(lidGeometry, lidMaterial);
                    lid.position.set(worldX, 0.7, worldZ - 0.35);
                    lid.castShadow = true;
                    scene.add(lid);
                    
                    object = { type: 'chest', x, z, mesh: [chest, lid], 
opened: false };
                    break;
            }
            
            gameObjects.push(object);
        }

        // Create player character
        function createPlayer() {
            const playerGroup = new THREE.Group();
            
            // Player body
            const bodyGeometry = new THREE.CylinderGeometry(0.4, 0.4, 1, 
8);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 
0x3498db });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.5;
            body.castShadow = true;
            playerGroup.add(body);
            
            // Player head
            const headGeometry = new THREE.SphereGeometry(0.4, 16, 16);
            const headMaterial = new THREE.MeshStandardMaterial({ color: 
0xffd700 });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.5;
            head.castShadow = true;
            playerGroup.add(head);
            
            // Player weapon
            const weaponGeometry = new THREE.BoxGeometry(0.1, 1.5, 0.1);
            const weaponMaterial = new THREE.MeshStandardMaterial({ color: 
0x7f8c8d });
            const weapon = new THREE.Mesh(weaponGeometry, weaponMaterial);
            weapon.position.set(0.6, 0.8, 0);
            weapon.rotation.z = Math.PI / 4;
            weapon.castShadow = true;
            playerGroup.add(weapon);
            
            playerMesh = playerGroup;
            scene.add(playerMesh);
            
            // Position player
            updatePlayerPosition();
        }

        // Update player position in the world
        function updatePlayerPosition() {
            const worldX = playerPosition.x * tileSize - (worldSize * 
tileSize) / 2 + tileSize / 2;
            const worldZ = playerPosition.z * tileSize - (worldSize * 
tileSize) / 2 + tileSize / 2;
            playerMesh.position.set(worldX, 0, worldZ);
        }

        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Handle key down events
        function onKeyDown(event) {
            keys[event.key.toLowerCase()] = true;
            
            // Interaction with 'E' key
            if (event.key.toLowerCase() === 'e') {
                interact();
            }
        }

        // Handle key up events
        function onKeyUp(event) {
            keys[event.key.toLowerCase()] = false;
        }

        // Handle mouse click for interaction
        function onMouseClick(event) {
            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
            
            // Update the picking ray with the camera and mouse position
            raycaster.setFromCamera(mouse, camera);
            
            // Calculate objects intersecting the picking ray
            const intersects = raycaster.intersectObjects(scene.children);
            
            if (intersects.length > 0) {
                // Check if we clicked on an interactive object
                for (let obj of gameObjects) {
                    if (obj.mesh && Array.isArray(obj.mesh)) {
                        for (let mesh of obj.mesh) {
                            if (intersects[0].object === mesh) {
                                interactWithObject(obj);
                                return;
                            }
                        }
                    } else if (obj.mesh === intersects[0].object) {
                        interactWithObject(obj);
                        return;
                    }
                }
            }
        }

        // Player interaction with objects
        function interact() {
            // Check if player is next to an object
            const adjacentPositions = [
                { x: playerPosition.x, z: playerPosition.z - 1 }, // North
                { x: playerPosition.x + 1, z: playerPosition.z }, // East
                { x: playerPosition.x, z: playerPosition.z + 1 }, // South
                { x: playerPosition.x - 1, z: playerPosition.z }  // West
            ];
            
            for (let pos of adjacentPositions) {
                for (let obj of gameObjects) {
                    if (obj.x === pos.x && obj.z === pos.z) {
                        interactWithObject(obj);
                        return;
                    }
                }
            }
        }

        // Interact with a specific object
        function interactWithObject(obj) {
            const messageElement = document.getElementById('message');
            
            switch(obj.type) {
                case 'chest':
                    if (!obj.opened) {
                        obj.opened = true;
                        obj.mesh[1].rotation.x = -Math.PI / 3; // Open the 
lid
                        const reward = Math.floor(Math.random() * 50) + 
10;
                        gold += reward;
                        document.getElementById('gold').textContent = 
gold;
                        showMessage(`You found ${reward} gold in the 
chest!`);
                    } else {
                        showMessage("The chest is empty.");
                    }
                    break;
                case 'tree':
                    showMessage("You examine the tree. It's a sturdy 
oak.");
                    break;
                case 'rock':
                    showMessage("You kick the rock. It's quite heavy.");
                    break;
            }
        }

        // Show message to player
        function showMessage(text) {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.classList.add('show');
            
            setTimeout(() => {
                messageElement.classList.remove('show');
            }, 3000);
        }

        // Update player movement
        function updatePlayerMovement(delta) {
            if (isMoving) {
                // Move player towards target
                const moveDistance = moveSpeed * delta;
                playerMesh.position.x += moveDirection.x * moveDistance;
                playerMesh.position.z += moveDirection.z * moveDistance;
                
                // Check if reached target
                const dx = playerMesh.position.x - moveTarget.x;
                const dz = playerMesh.position.z - moveTarget.z;
                if (Math.abs(dx) < 0.1 && Math.abs(dz) < 0.1) {
                    isMoving = false;
                    playerPosition.x = Math.round((playerMesh.position.x + 
(worldSize * tileSize) / 2 - tileSize / 2) / tileSize);
                    playerPosition.z = Math.round((playerMesh.position.z + 
(worldSize * tileSize) / 2 - tileSize / 2) / tileSize);
                    updatePlayerPosition();
                }
            } else {
                // Check for movement input
                let moveX = 0;
                let moveZ = 0;
                
                if (keys['w'] || keys['arrowup']) {
                    moveZ = -1;
                    playerDirection = { x: 0, z: -1 };
                }
                if (keys['s'] || keys['arrowdown']) {
                    moveZ = 1;
                    playerDirection = { x: 0, z: 1 };
                }
                if (keys['a'] || keys['arrowleft']) {
                    moveX = -1;
                    playerDirection = { x: -1, z: 0 };
                }
                if (keys['d'] || keys['arrowright']) {
                    moveX = 1;
                    playerDirection = { x: 1, z: 0 };
                }
                
                // Normalize diagonal movement
                if (moveX !== 0 && moveZ !== 0) {
                    moveX *= 0.7071;
                    moveZ *= 0.7071;
                }
                
                if (moveX !== 0 || moveZ !== 0) {
                    const targetX = playerPosition.x + moveX;
                    const targetZ = playerPosition.z + moveZ;
                    
                    // Check if target position is valid
                    if (targetX >= 0 && targetX < worldSize && 
                        targetZ >= 0 && targetZ < worldSize) {
                        
                        // Check for obstacles
                        let canMove = true;
                        for (let obj of gameObjects) {
                            if (obj.x === targetX && obj.z === targetZ && 
obj.type !== 'chest') {
                                canMove = false;
                                break;
                            }
                        }
                        
                        if (canMove) {
                            isMoving = true;
                            moveDirection = { x: moveX, z: moveZ };
                            moveTarget = {
                                x: targetX * tileSize - (worldSize * 
tileSize) / 2 + tileSize / 2,
                                z: targetZ * tileSize - (worldSize * 
tileSize) / 2 + tileSize / 2
                            };
                        }
                    }
                }
            }
        }

        // Update health display
        function updateHealth() {
            // Simulate health regeneration
            if (health < 100 && Math.random() > 0.95) {
                health = Math.min(100, health + 0.1);
                document.getElementById('health').textContent = 
Math.floor(health);
            }
        }

        // Update level display
        function updateLevel() {
            // Simulate level progression
            if (Math.random() > 0.999) {
                level++;
                document.getElementById('level').textContent = level;
                showMessage(`You leveled up! You are now level 
${level}.`);
            }
        }

        // Game animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            
            // Update player movement
            updatePlayerMovement(delta);
            
            // Update UI
            updateHealth();
            updateLevel();
            
            // Rotate directional light for dynamic lighting
            const time = Date.now() * 0.0005;
            const directionalLight = scene.children.find(child => child 
instanceof THREE.DirectionalLight);
            if (directionalLight) {
                directionalLight.position.x = Math.sin(time) * 15;
                directionalLight.position.z = Math.cos(time) * 15;
            }
            
            // Render scene
            renderer.render(scene, camera);
        }

        // Simulate loading progress
        function simulateLoading() {
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    init();
                }
                document.getElementById('progress').style.width = 
`${progress}%`;
            }, 100);
        }

        // Start the loading simulation
        simulateLoading();
    </script>
</body>
</html>
